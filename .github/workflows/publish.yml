name: Publish a package to npm

# Run from the Actions tab (or by Claude): pick the workspace package to publish.
# Publishes with npm trusted publishing (OIDC): no token, no one-time password.
# Each robolance-* package on npmjs.com lists this repository and this workflow
# file as its trusted publisher (package Settings > Trusted Publisher > GitHub
# Actions: owner shaikh-amer, repository Robolance, workflow publish.yml). The
# version is the one in the package's package.json; publishing an existing
# version fails safely.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Workspace package to publish
        required: true
        default: robolance-openlance-hardware
        type: choice
        options:
          - robolance-openlance-hardware
          - robolance-duck-sim
          - robolance-hardware-tools
          - robolance-hardware-sim
          - robolance-mujoco

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test -w ${{ inputs.package }} --if-present
      - run: npm publish -w ${{ inputs.package }} --access public
